<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Live View</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .box { font-size: 2em; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Live View</h1>
  <div id="batteryVoltage" class="box">Lade...</div>
  <div id="pitch" class="box">Lade...</div>
  <div id="roll" class="box">Lade...</div>
  <div id="throttle" class="box">Lade...</div>
  <div id="armed" class="box">Lade...</div>
  <div id="orientation" class="box">Lade...</div>
  <div id="stickLeftRight" class="box">Lade...</div>
  <div id="stickUpDown" class="box">Lade...</div>
  <div id="trimRoll" class="box">Lade...</div>
  <div id="trimPitch" class="box">Lade...</div>
  <h1>Configuration</h1>
  <h1>WLAN</h1>
  <label>SSID: <input id="ssid" type="text"></label><br><br>
  <label>Passwort: <input id="password" type="password"></label><br><br>
  <label>AP SSID: <input id="aPssid" type="text"></label><br><br>
  <label>AP Passwort: <input id="aPpassword" type="password"></label><br><br>
  <button onclick="saveWlan()">Save WLAN</button>

  <script>
    function saveWlan() {
      const ssid = document.getElementById('ssid').value;
      const password = document.getElementById('password').value;
      const aPssid = document.getElementById('aPssid').value;
      const aPpassword = document.getElementById('aPpassword').value;
      fetch('/saveWlan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ssid, password })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert('Konfiguration gespeichert!');
        } else {
          alert('Fehler beim Speichern der Konfiguration!');
        }
      })
      .catch(err => console.error(err));
      loadWlan();
    }
    function loadWlan() {
      fetch('/loadWlan')
        .then(response => response.json())
        .then(data => {
          document.getElementById('ssid').value = data.ssid || '';
          document.getElementById('password').value = data.password || '';
          document.getElementById('aPssid').value = data.aPssid || '';
          document.getElementById('aPpassword').value = data.aPpassword || '';
        })
        .catch(err => console.error(err));
    }
    function updateLiveView() {
      fetch('/liveView')
        .then(response => response.json())
        .then(data => {
            document.getElementById('batteryVoltage').textContent = "Battery = " + data.batteryVoltage.toFixed(2) + ' V';
            document.getElementById('pitch').textContent = "Pitch = " + data.pitch.toFixed(2)*100 + ' %';
            document.getElementById('roll').textContent = "Roll = " + data.roll.toFixed(2)*100 + ' %';
            document.getElementById('throttle').textContent = "Throttle = " + data.throttle.toFixed(2)*100 + ' %';
            document.getElementById('armed').textContent = "Armed = " + (data.armed ? 'Ja' : 'Nein');
            document.getElementById('orientation').textContent = "Orientation = " + data.orientation;
            document.getElementById('stickLeftRight').textContent = "Stick Left/Right = " + data.stickLeftRight.toFixed(2)*100 + ' %';
            document.getElementById('stickUpDown').textContent = "Stick Up/Down = " + data.stickUpDown.toFixed(2)*100 + ' %';
            document.getElementById('trimRoll').textContent = "Trim Roll = " + data.trimRoll.toFixed(2)*100 + ' %';
            document.getElementById('trimPitch').textContent = "Trim Pitch = " + data.trimPitch.toFixed(2)*100 + ' %';
        })
        .catch(err => {
          document.getElementById('voltage').textContent = 'Fehler';
          console.error(err);
        });
    }

    setInterval(updateLiveView, 1000); // jede Sekunde
    updateLiveView(); // sofort beim Start
    loadWlan(); // sofort beim Start
  </script>
</body>
</html>
